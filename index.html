<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videx — AI Creator Studio</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #05050f; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

const C = {
  bg:"#05050f", surface:"#0c0c1e", card:"#10102a",
  border:"rgba(99,102,241,0.25)",
  neon1:"#6366f1", neon2:"#06b6d4", neon3:"#f59e0b", neon4:"#ec4899",
  text:"#e8e8ff", muted:"#6b6b9a", success:"#10b981", error:"#f43f5e",
};

const STEPS = [
  { icon:"✍", label:"Script", sub:"& Lyrics", desc:"Write your script, lyrics & scene prompts" },
  { icon:"🎵", label:"Music",  sub:"Suno AI",  desc:"Generate a full song with real vocals" },
  { icon:"🎙", label:"Voice",  sub:"ElevenLabs", desc:"Synthesize a cinematic voiceover" },
  { icon:"🎬", label:"Video",  sub:"Runway / Luma", desc:"Render your video scenes with AI" },
];

const VOICES = [
  { id:"21m00Tcm4TlvDq8ikWAM", name:"Rachel — Female, Calm" },
  { id:"AZnzlk1XvdvUeBnXmlld", name:"Domi — Female, Strong" },
  { id:"EXAVITQu4vr4xnSDxMaL", name:"Bella — Female, Soft" },
  { id:"ErXwobaYiN019PkySvjV", name:"Antoni — Male, Warm" },
  { id:"pNInz6obpgDQGcFmaJgB", name:"Adam — Male, Deep" },
  { id:"VR6AewLTigWG4xSOukaG", name:"Arnold — Male, Crisp" },
];

function Glow({ color=C.neon1, size=400, x="50%", y="50%", opacity=0.09 }) {
  return <div style={{ position:"absolute", pointerEvents:"none", borderRadius:"50%",
    width:size, height:size, left:x, top:y, transform:"translate(-50%,-50%)",
    background:color, filter:`blur(${size*0.42}px)`, opacity }} />;
}

function Spinner({ color=C.neon2 }) {
  return <span style={{ display:"inline-block", width:13, height:13,
    border:`2px solid ${color}30`, borderTop:`2px solid ${color}`,
    borderRadius:"50%", animation:"spin 0.7s linear infinite",
    verticalAlign:"middle", marginRight:7 }} />;
}

function StatusPill({ status }) {
  const map = { idle:{c:C.muted,l:"Ready"}, loading:{c:C.neon2,l:"Working..."}, done:{c:C.success,l:"Done ✓"}, error:{c:C.error,l:"Error"} };
  const s = map[status]||map.idle;
  return <span style={{ display:"inline-flex", alignItems:"center", fontSize:11, fontWeight:800,
    color:s.c, fontFamily:"'Syne',sans-serif", letterSpacing:1 }}>
    <span style={{ width:7,height:7,borderRadius:"50%",background:s.c,marginRight:6,
      boxShadow:`0 0 8px ${s.c}`, animation:status==="loading"?"pulse 1.2s ease-in-out infinite":"none" }} />
    {s.l}
  </span>;
}

const inp = { background:"#08081a", border:`1px solid ${C.border}`, borderRadius:10,
  color:C.text, padding:"11px 14px", width:"100%", fontSize:13,
  fontFamily:"'Syne',sans-serif", outline:"none", boxSizing:"border-box", transition:"border-color 0.2s" };

const lbl = { display:"block", fontSize:10, fontWeight:800, letterSpacing:2,
  color:C.neon2, marginBottom:7, textTransform:"uppercase", fontFamily:"'Syne',sans-serif" };

function Field({ label:l, children }) {
  return <div style={{ marginBottom:14 }}><label style={lbl}>{l}</label>{children}</div>;
}

function FocusInp(props) {
  const [f,setF]=useState(false);
  return <input {...props} onFocus={()=>setF(true)} onBlur={()=>setF(false)}
    style={{ ...inp, ...props.style, borderColor:f?C.neon1:C.border }} />;
}

function FocusTxta(props) {
  const [f,setF]=useState(false);
  return <textarea {...props} onFocus={()=>setF(true)} onBlur={()=>setF(false)}
    style={{ ...inp, resize:"vertical", lineHeight:1.7, ...props.style, borderColor:f?C.neon1:C.border }} />;
}

function Sel({ children, ...props }) {
  return <select {...props} style={{ ...inp, cursor:"pointer", appearance:"none", ...props.style }}>{children}</select>;
}

function BtnPrimary({ children, disabled, onClick, style:s }) {
  const [h,setH]=useState(false);
  return <button onClick={onClick} disabled={disabled}
    onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
    style={{ background:`linear-gradient(135deg,${C.neon1},${C.neon4})`,
      border:"none", borderRadius:10, color:"#fff", fontWeight:800, fontSize:13,
      padding:"12px 24px", cursor:disabled?"not-allowed":"pointer",
      fontFamily:"'Syne',sans-serif", letterSpacing:1,
      opacity:disabled?0.5:1, boxShadow:h&&!disabled?`0 0 28px ${C.neon1}60`:"none",
      transform:h&&!disabled?"translateY(-2px)":"none",
      transition:"all 0.2s", ...s }}>
    {children}
  </button>;
}

function BtnGhost({ children, onClick, active, color=C.neon1, disabled }) {
  const [h,setH]=useState(false);
  return <button onClick={onClick} disabled={disabled}
    onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
    style={{ background:active?`${color}18`:h?`${color}0e`:"transparent",
      border:`1px solid ${active?color:h?`${color}60`:C.border}`,
      borderRadius:9, color:active?color:C.muted, fontWeight:700, fontSize:12,
      padding:"9px 18px", cursor:"pointer", fontFamily:"'Syne',sans-serif",
      letterSpacing:0.8, transition:"all 0.18s", boxShadow:active?`0 0 12px ${color}30`:"none" }}>
    {children}
  </button>;
}

function Card({ color=C.neon1, title, children }) {
  return <div style={{ background:C.card, border:`1px solid ${color}40`,
    borderRadius:14, overflow:"hidden", boxShadow:`0 0 30px ${color}10`, animation:"fadeUp 0.4s ease" }}>
    <div style={{ padding:"12px 18px", borderBottom:`1px solid ${color}25`,
      background:`${color}0a`, display:"flex", alignItems:"center", gap:8 }}>
      <div style={{ width:6,height:6,borderRadius:"50%",background:color,boxShadow:`0 0 8px ${color}` }} />
      <span style={{ fontSize:11,fontWeight:800,color,letterSpacing:2,textTransform:"uppercase",fontFamily:"'Syne',sans-serif" }}>{title}</span>
    </div>
    <div style={{ padding:18 }}>{children}</div>
  </div>;
}

function EmptyState({ icon, title, sub }) {
  return <div style={{ height:"100%", minHeight:280, border:`1px dashed ${C.border}`, borderRadius:14,
    display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:10, color:C.muted }}>
    <div style={{ fontSize:48, opacity:0.2 }}>{icon}</div>
    <div style={{ fontSize:12, fontFamily:"'Syne',sans-serif", fontWeight:800 }}>{title}</div>
    <div style={{ fontSize:11, fontFamily:"'Syne',sans-serif" }}>{sub}</div>
  </div>;
}

function ScriptPanel({ onReady }) {
  const [topic,setTopic]=useState(""); const [genre,setGenre]=useState("Afrobeats");
  const [mood,setMood]=useState("Energetic"); const [lang,setLang]=useState("English");
  const [dur,setDur]=useState("3-5 min");
  const [checks,setChecks]=useState({script:true,lyrics:true,scenes:true});
  const [status,setStatus]=useState("idle"); const [out,setOut]=useState(""); const [err,setErr]=useState("");

  const go=async()=>{
    if(!topic.trim())return;
    setStatus("loading");setErr("");setOut("");
    const want=[];
    if(checks.script) want.push("a full video script with scene descriptions");
    if(checks.lyrics) want.push("complete song lyrics (verse 1, pre-chorus, chorus, verse 2, bridge, outro)");
    if(checks.scenes) want.push("numbered cinematic scene prompts optimized for AI video generation");
    try {
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000,
          messages:[{role:"user",content:`You are Videx AI — a bold, professional creative studio AI.\n\nCreate ${want.join(", ")} for a ${dur} ${genre} ${mood} ${lang} production about: "${topic}"\n\nUse headers: ## 🎬 VIDEO SCRIPT, ## 🎵 SONG LYRICS, ## 📽 SCENE PROMPTS\nMake it production-ready, vivid, and commercially powerful.`}] }),
      });
      const data=await res.json();
      const text=data.content?.find(b=>b.type==="text")?.text||"";
      setOut(text);setStatus("done");onReady(text);
    } catch { setErr("Generation failed.");setStatus("error"); }
  };

  return <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:24 }}>
    <div>
      <Field label="Topic / Creative Vision">
        <FocusTxta rows={3} value={topic} onChange={e=>setTopic(e.target.value)}
          placeholder="e.g. Rising from hardship, a night in Lagos, first love on the water..." />
      </Field>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14 }}>
        <Field label="Genre"><Sel value={genre} onChange={e=>setGenre(e.target.value)}>
          {["Afrobeats","Pop","R&B","Hip-Hop","Reggae","Gospel","Dancehall","Amapiano","Electronic","Jazz","Folk"].map(g=><option key={g}>{g}</option>)}
        </Sel></Field>
        <Field label="Mood"><Sel value={mood} onChange={e=>setMood(e.target.value)}>
          {["Energetic","Uplifting","Romantic","Melancholic","Dramatic","Peaceful","Fierce","Nostalgic"].map(m=><option key={m}>{m}</option>)}
        </Sel></Field>
        <Field label="Language"><Sel value={lang} onChange={e=>setLang(e.target.value)}>
          {["English","French","Fon","Yoruba","Swahili","Spanish","Portuguese","Arabic","Hindi","Pidgin"].map(l=><option key={l}>{l}</option>)}
        </Sel></Field>
        <Field label="Duration"><Sel value={dur} onChange={e=>setDur(e.target.value)}>
          {["1-2 min","3-5 min","5-10 min","10-20 min","20+ min"].map(d=><option key={d}>{d}</option>)}
        </Sel></Field>
      </div>
      <div style={{ display:"flex",gap:18,marginBottom:20 }}>
        {[["script","📄 Script"],["lyrics","🎵 Lyrics"],["scenes","🎬 Scenes"]].map(([k,l])=>(
          <label key={k} style={{ display:"flex",alignItems:"center",gap:7,cursor:"pointer",
            fontSize:12,color:checks[k]?C.neon2:C.muted,fontFamily:"'Syne',sans-serif",fontWeight:700 }}>
            <input type="checkbox" checked={checks[k]} onChange={e=>setChecks(p=>({...p,[k]:e.target.checked}))}
              style={{ accentColor:C.neon1,width:14,height:14 }} />{l}
          </label>
        ))}
      </div>
      <div style={{ display:"flex",alignItems:"center",gap:14 }}>
        <BtnPrimary onClick={go} disabled={status==="loading"||!topic.trim()}>
          {status==="loading"&&<Spinner />}{status==="loading"?"Generating...":"⚡ Generate"}
        </BtnPrimary>
        <StatusPill status={status} />
      </div>
      {err&&<div style={{color:C.error,fontSize:12,marginTop:10,fontFamily:"'Syne',sans-serif"}}>{err}</div>}
    </div>
    <div>
      {out ? <Card title="Generated Content" color={C.neon1}>
        <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
          <BtnGhost onClick={()=>navigator.clipboard.writeText(out)}>Copy All</BtnGhost>
        </div>
        <pre style={{color:C.text,fontSize:12,lineHeight:1.8,whiteSpace:"pre-wrap",
          fontFamily:"'Syne',sans-serif",margin:0,maxHeight:360,overflowY:"auto"}}>{out}</pre>
      </Card> : <EmptyState icon="✍" title="Your content appears here" sub="Fill the form and hit Generate" />}
    </div>
  </div>;
}

function MusicPanel({ apiKeys, script }) {
  const [prompt,setPrompt]=useState(""); const [tags,setTags]=useState("");
  const [status,setStatus]=useState("idle"); const [result,setResult]=useState(null); const [err,setErr]=useState("");
  useEffect(()=>{ if(script)setPrompt(script.substring(0,300)); },[script]);

  const poll=async(id)=>{
    for(let i=0;i<30;i++){
      await new Promise(r=>setTimeout(r,5000));
      try{
        const res=await fetch(`https://api.sunoaiapi.com/api/v1/gateway/feed/${id}`,{headers:{"api-key":apiKeys.suno}});
        const data=await res.json(); const s=data?.data?.[0];
        if(s?.status==="complete"&&s?.audio_url){setResult(s);setStatus("done");return;}
        if(s?.status==="error"){setErr("Suno failed.");setStatus("error");return;}
      }catch{}
    }
    setErr("Timed out.");setStatus("error");
  };

  const go=async()=>{
    if(!apiKeys.suno){setErr("Add your Suno AI key in ⚙ Settings.");return;}
    setStatus("loading");setErr("");setResult(null);
    try{
      const res=await fetch("https://api.sunoaiapi.com/api/v1/gateway/generate/music",{
        method:"POST", headers:{"Content-Type":"application/json","api-key":apiKeys.suno},
        body:JSON.stringify({gpt_description_prompt:prompt+(tags?` Style: ${tags}`:""),make_instrumental:false,mv:"chirp-v3-5"}),
      });
      const data=await res.json(); const id=data?.data?.[0]?.song_id;
      if(id)poll(id); else{setErr(data?.message||"Suno failed.");setStatus("error");}
    }catch{setErr("Request failed.");setStatus("error");}
  };

  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
    <div>
      <div style={{marginBottom:16,padding:"12px 16px",background:`${C.neon3}0a`,border:`1px solid ${C.neon3}30`,borderRadius:10}}>
        <span style={{fontSize:10,fontWeight:800,color:C.neon3,letterSpacing:2,fontFamily:"'Syne',sans-serif"}}>SUNO AI</span>
        <p style={{fontSize:12,color:C.muted,marginTop:6,fontFamily:"'Syne',sans-serif",lineHeight:1.6}}>Full songs with real vocals & instruments from your prompt.</p>
      </div>
      <Field label="Music Prompt">
        <FocusTxta rows={5} value={prompt} onChange={e=>setPrompt(e.target.value)}
          placeholder="Describe the feel: mood, story, energy, instruments, vocal style..." />
      </Field>
      <Field label="Style Tags (optional)">
        <FocusInp value={tags} onChange={e=>setTags(e.target.value)}
          placeholder="e.g. afrobeats, female vocal, 120bpm, uplifting" />
      </Field>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <BtnPrimary onClick={go} disabled={status==="loading"}>
          {status==="loading"&&<Spinner color={C.neon3} />}{status==="loading"?"Composing...":"🎵 Generate Music"}
        </BtnPrimary>
        <StatusPill status={status} />
      </div>
      {err&&<div style={{color:C.error,fontSize:12,marginTop:10,fontFamily:"'Syne',sans-serif"}}>{err}</div>}
    </div>
    <div>
      {result ? <Card title="Your Track" color={C.neon3}>
        <div style={{fontSize:14,fontWeight:800,color:C.text,marginBottom:14,fontFamily:"'Syne',sans-serif"}}>{result.title||"Untitled Track"}</div>
        <audio controls src={result.audio_url} style={{width:"100%",marginBottom:14,borderRadius:8}} />
        <a href={result.audio_url} download style={{textDecoration:"none"}}><BtnGhost color={C.neon3}>⬇ Download MP3</BtnGhost></a>
      </Card> : <EmptyState icon="🎵" title="Music plays here" sub="Takes ~30-60s after generating" />}
    </div>
  </div>;
}

function VoicePanel({ apiKeys, script }) {
  const [text,setText]=useState(""); const [voiceId,setVoiceId]=useState("21m00Tcm4TlvDq8ikWAM");
  const [stability,setStability]=useState(0.5); const [status,setStatus]=useState("idle");
  const [audioUrl,setAudioUrl]=useState(""); const [err,setErr]=useState("");
  useEffect(()=>{ if(script)setText(script.substring(0,2500)); },[script]);

  const go=async()=>{
    if(!apiKeys.elevenlabs){setErr("Add your ElevenLabs key in ⚙ Settings.");return;}
    setStatus("loading");setErr("");setAudioUrl("");
    try{
      const res=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`,{
        method:"POST", headers:{"Content-Type":"application/json","xi-api-key":apiKeys.elevenlabs},
        body:JSON.stringify({text:text.substring(0,2500),model_id:"eleven_multilingual_v2",
          voice_settings:{stability,similarity_boost:0.75}}),
      });
      if(!res.ok){setErr("ElevenLabs failed. Check your key.");setStatus("error");return;}
      const blob=await res.blob();
      setAudioUrl(URL.createObjectURL(blob));setStatus("done");
    }catch{setErr("Request failed.");setStatus("error");}
  };

  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
    <div>
      <div style={{marginBottom:16,padding:"12px 16px",background:`${C.neon4}0a`,border:`1px solid ${C.neon4}30`,borderRadius:10}}>
        <span style={{fontSize:10,fontWeight:800,color:C.neon4,letterSpacing:2,fontFamily:"'Syne',sans-serif"}}>ELEVENLABS</span>
        <p style={{fontSize:12,color:C.muted,marginTop:6,fontFamily:"'Syne',sans-serif",lineHeight:1.6}}>Ultra-realistic AI voices in 30+ languages for narration & storytelling.</p>
      </div>
      <Field label={`Narration Text (${text.length}/2500)`}>
        <FocusTxta rows={6} value={text} onChange={e=>setText(e.target.value)} placeholder="Paste your script or narration here..." />
      </Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
        <Field label="Voice"><Sel value={voiceId} onChange={e=>setVoiceId(e.target.value)}>
          {VOICES.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
        </Sel></Field>
        <Field label={`Stability: ${stability}`}>
          <input type="range" min="0" max="1" step="0.05" value={stability}
            onChange={e=>setStability(parseFloat(e.target.value))}
            style={{width:"100%",accentColor:C.neon4,marginTop:10}} />
        </Field>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <BtnPrimary onClick={go} disabled={status==="loading"}>
          {status==="loading"&&<Spinner color={C.neon4} />}{status==="loading"?"Synthesizing...":"🎙 Generate Voice"}
        </BtnPrimary>
        <StatusPill status={status} />
      </div>
      {err&&<div style={{color:C.error,fontSize:12,marginTop:10,fontFamily:"'Syne',sans-serif"}}>{err}</div>}
    </div>
    <div>
      {audioUrl ? <Card title="Voiceover" color={C.neon4}>
        <audio controls src={audioUrl} style={{width:"100%",marginBottom:14,borderRadius:8}} />
        <a href={audioUrl} download="videx-voice.mp3" style={{textDecoration:"none"}}><BtnGhost color={C.neon4}>⬇ Download Audio</BtnGhost></a>
      </Card> : <EmptyState icon="🎙" title="Voiceover appears here" sub="Pick a voice and generate" />}
    </div>
  </div>;
}

function VideoPanel({ apiKeys, script }) {
  const [engine,setEngine]=useState("runway"); const [prompt,setPrompt]=useState("");
  const [duration,setDuration]=useState(5); const [ratio,setRatio]=useState("1280:720");
  const [status,setStatus]=useState("idle"); const [videoUrl,setVideoUrl]=useState("");
  const [err,setErr]=useState(""); const [elapsed,setElapsed]=useState(0);
  const timer=useRef(null);
  useEffect(()=>{ if(script){ const m=script.match(/scene prompt[s]?[:\s\n]+([\s\S]{0,500})/i); setPrompt(m?m[1].trim():script.substring(0,400)); } },[script]);
  useEffect(()=>{
    if(status==="loading"){setElapsed(0);timer.current=setInterval(()=>setElapsed(p=>p+1),1000);}
    else clearInterval(timer.current);
    return()=>clearInterval(timer.current);
  },[status]);
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

  const pollRunway=async(id)=>{
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,5000));
      try{
        const res=await fetch(`https://api.dev.runwayml.com/v1/tasks/${id}`,{headers:{"Authorization":`Bearer ${apiKeys.runway}`,"X-Runway-Version":"2024-11-06"}});
        const d=await res.json();
        if(d?.status==="SUCCEEDED"&&d?.output?.[0]){setVideoUrl(d.output[0]);setStatus("done");return;}
        if(d?.status==="FAILED"){setErr("Runway failed.");setStatus("error");return;}
      }catch{}
    }
    setErr("Timed out.");setStatus("error");
  };

  const pollLuma=async(id)=>{
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,5000));
      try{
        const res=await fetch(`https://api.lumalabs.ai/dream-machine/v1/generations/${id}`,{headers:{"Authorization":`Bearer ${apiKeys.luma}`}});
        const d=await res.json();
        if(d?.state==="completed"&&d?.assets?.video){setVideoUrl(d.assets.video);setStatus("done");return;}
        if(d?.state==="failed"){setErr("Luma failed.");setStatus("error");return;}
      }catch{}
    }
    setErr("Timed out.");setStatus("error");
  };

  const go=async()=>{
    const key=engine==="runway"?apiKeys.runway:apiKeys.luma;
    if(!key){setErr(`Add your ${engine==="runway"?"Runway ML":"Luma AI"} key in ⚙ Settings.`);return;}
    setStatus("loading");setErr("");setVideoUrl("");
    try{
      if(engine==="runway"){
        const res=await fetch("https://api.dev.runwayml.com/v1/image_to_video",{
          method:"POST", headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKeys.runway}`,"X-Runway-Version":"2024-11-06"},
          body:JSON.stringify({promptText:prompt,model:"gen4_turbo",ratio,duration}),
        });
        const d=await res.json();
        if(d?.id)pollRunway(d.id); else{setErr(d?.message||"Runway failed.");setStatus("error");}
      } else {
        const res=await fetch("https://api.lumalabs.ai/dream-machine/v1/generations",{
          method:"POST", headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKeys.luma}`},
          body:JSON.stringify({prompt,aspect_ratio:"16:9",loop:false}),
        });
        const d=await res.json();
        if(d?.id)pollLuma(d.id); else{setErr(d?.detail||"Luma failed.");setStatus("error");}
      }
    }catch{setErr("Request failed.");setStatus("error");}
  };

  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
    <div>
      <div style={{display:"flex",gap:10,marginBottom:18}}>
        <BtnGhost onClick={()=>setEngine("runway")} active={engine==="runway"} color={C.neon2}>🎬 Runway ML</BtnGhost>
        <BtnGhost onClick={()=>setEngine("luma")} active={engine==="luma"} color={C.neon3}>✨ Luma AI</BtnGhost>
      </div>
      <Field label="Scene Description">
        <FocusTxta rows={5} value={prompt} onChange={e=>setPrompt(e.target.value)}
          placeholder="Cinematic scene: setting, lighting, camera movement, characters, mood..." />
      </Field>
      {engine==="runway"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
        <Field label="Duration"><Sel value={duration} onChange={e=>setDuration(Number(e.target.value))}>
          <option value={5}>5 seconds</option><option value={10}>10 seconds</option>
        </Sel></Field>
        <Field label="Aspect Ratio"><Sel value={ratio} onChange={e=>setRatio(e.target.value)}>
          <option value="1280:720">16:9 Landscape</option>
          <option value="720:1280">9:16 Portrait</option>
          <option value="1024:1024">1:1 Square</option>
        </Sel></Field>
      </div>}
      <div style={{background:`${C.neon2}0a`,border:`1px solid ${C.neon2}25`,borderRadius:10,
        padding:"10px 14px",marginBottom:16,fontSize:12,color:C.muted,fontFamily:"'Syne',sans-serif",lineHeight:1.6}}>
        ⏱ Video takes <strong style={{color:C.neon2}}>2–5 minutes</strong>. Keep this tab open.
      </div>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <BtnPrimary onClick={go} disabled={status==="loading"}>
          {status==="loading"&&<Spinner color={C.neon2} />}
          {status==="loading"?`Rendering… ${fmt(elapsed)}`:"🎬 Generate Video"}
        </BtnPrimary>
        <StatusPill status={status} />
      </div>
      {err&&<div style={{color:C.error,fontSize:12,marginTop:10,fontFamily:"'Syne',sans-serif"}}>{err}</div>}
    </div>
    <div>
      {videoUrl ? <Card title="Generated Scene" color={C.neon2}>
        <video controls src={videoUrl} style={{width:"100%",borderRadius:10,marginBottom:14}} />
        <a href={videoUrl} download="videx-scene.mp4" style={{textDecoration:"none"}}><BtnGhost color={C.neon2}>⬇ Download MP4</BtnGhost></a>
      </Card> : <EmptyState icon="🎬" title="Video renders here" sub="Cinematic quality, scene by scene" />}
    </div>
  </div>;
}

function Settings({ keys, setKeys, onClose }) {
  const [local,setLocal]=useState({...keys}); const [show,setShow]=useState({});
  const fields=[
    {k:"suno",label:"Suno AI",color:C.neon3},{k:"elevenlabs",label:"ElevenLabs",color:C.neon4},
    {k:"runway",label:"Runway ML",color:C.neon2},{k:"luma",label:"Luma AI",color:C.neon1},
  ];
  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",
    alignItems:"center",justifyContent:"center",zIndex:2000,backdropFilter:"blur(10px)"}}>
    <div style={{background:C.surface,border:`1px solid ${C.neon1}40`,borderRadius:18,padding:32,
      width:"min(460px,92vw)",boxShadow:`0 0 60px ${C.neon1}20`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
        <span style={{fontSize:18,fontWeight:900,fontFamily:"'Syne',sans-serif",
          background:`linear-gradient(135deg,${C.neon1},${C.neon2})`,
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>API Keys</span>
        <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:22}}>✕</button>
      </div>
      {fields.map(({k,label:l,color})=>(
        <div key={k} style={{marginBottom:14}}>
          <label style={{...lbl,color}}>{l}</label>
          <div style={{position:"relative"}}>
            <input type={show[k]?"text":"password"} value={local[k]}
              onChange={e=>setLocal(p=>({...p,[k]:e.target.value}))}
              placeholder={`Your ${l} API key`}
              style={{...inp,paddingRight:52}} />
            <button onClick={()=>setShow(p=>({...p,[k]:!p[k]}))}
              style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",
                background:"none",border:"none",color,cursor:"pointer",
                fontSize:10,fontWeight:800,letterSpacing:1,fontFamily:"'Syne',sans-serif"}}>
              {show[k]?"HIDE":"SHOW"}
            </button>
          </div>
        </div>
      ))}
      <BtnPrimary onClick={()=>{setKeys(local);onClose();}} style={{width:"100%",marginTop:10}}>Save Keys</BtnPrimary>
      <p style={{fontSize:10,color:C.muted,marginTop:12,fontFamily:"'Syne',sans-serif",lineHeight:1.7}}>
        Keys live in memory only — cleared when you close this tab. Never logged or shared.
      </p>
    </div>
  </div>;
}

function App() {
  const [step,setStep]=useState(0);
  const [keys,setKeys]=useState({suno:"",elevenlabs:"",runway:"",luma:""});
  const [showSettings,setShowSettings]=useState(false);
  const [script,setScript]=useState("");
  const keysSet=Object.values(keys).some(v=>v.length>0);

  return <>
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&display=swap');
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      body{background:${C.bg};font-family:'Syne',sans-serif}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}
      @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:${C.neon1}50;border-radius:2px}
      select option{background:${C.surface};color:${C.text}}
    `}</style>

    <div style={{minHeight:"100vh",background:C.bg,color:C.text,position:"relative",overflow:"hidden"}}>
      <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0}}>
        <Glow color={C.neon1} size={700} x="5%" y="15%" opacity={0.07} />
        <Glow color={C.neon4} size={500} x="95%" y="55%" opacity={0.06} />
        <Glow color={C.neon2} size={400} x="55%" y="95%" opacity={0.05} />
      </div>

      <header style={{position:"sticky",top:0,zIndex:100,
        background:"rgba(5,5,15,0.9)",backdropFilter:"blur(20px)",
        borderBottom:`1px solid ${C.border}`,
        display:"flex",alignItems:"center",justifyContent:"space-between",
        padding:"0 24px",height:58}}>
        <div style={{display:"flex",alignItems:"center",gap:11}}>
          <div style={{width:32,height:32,borderRadius:9,
            background:`linear-gradient(135deg,${C.neon1},${C.neon4})`,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:16,boxShadow:`0 0 18px ${C.neon1}50`}}>⚡</div>
          <div>
            <div style={{fontSize:17,fontWeight:900,letterSpacing:3,
              background:`linear-gradient(135deg,${C.neon2},${C.neon1},${C.neon4})`,
              WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>VIDEX</div>
            <div style={{fontSize:8,color:C.muted,letterSpacing:2,marginTop:-2}}>AI CREATOR STUDIO</div>
          </div>
        </div>

        <div style={{display:"flex",alignItems:"center",gap:3}}>
          {STEPS.map((s,i)=>(
            <div key={s.label} style={{display:"flex",alignItems:"center"}}>
              <button onClick={()=>setStep(i)} style={{
                background:step===i?`linear-gradient(135deg,${C.neon1},${C.neon4})`:"transparent",
                border:step===i?"none":`1px solid ${i<step?C.neon1:C.border}`,
                borderRadius:8,padding:"5px 13px",cursor:"pointer",
                color:step===i?"#fff":i<step?C.neon1:C.muted,
                fontSize:11,fontWeight:800,letterSpacing:0.8,
                fontFamily:"'Syne',sans-serif",
                boxShadow:step===i?`0 0 16px ${C.neon1}50`:"none",
                transition:"all 0.2s",
              }}>{s.icon} {s.label}</button>
              {i<STEPS.length-1&&<div style={{width:16,height:1,background:i<step?C.neon1:C.border,margin:"0 1px"}} />}
            </div>
          ))}
        </div>

        <button onClick={()=>setShowSettings(true)} style={{
          background:keysSet?`${C.neon1}15`:"transparent",
          border:`1px solid ${keysSet?C.neon1:C.border}`,
          borderRadius:9,padding:"6px 15px",cursor:"pointer",
          color:keysSet?C.neon1:C.muted,fontSize:12,fontWeight:800,
          letterSpacing:1,fontFamily:"'Syne',sans-serif",
          boxShadow:keysSet?`0 0 12px ${C.neon1}30`:"none",transition:"all 0.2s",
        }}>⚙ {keysSet?"Keys ✓":"API Keys"}</button>
      </header>

      <div style={{
        background:`linear-gradient(90deg,${C.neon1}10,${C.neon4}07,transparent)`,
        borderBottom:`1px solid ${C.border}`,
        padding:"14px 24px",display:"flex",alignItems:"center",gap:14,
      }}>
        <div style={{width:42,height:42,borderRadius:12,
          background:`linear-gradient(135deg,${C.neon1}25,${C.neon4}18)`,
          border:`1px solid ${C.neon1}35`,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>
          {STEPS[step].icon}
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:17,fontWeight:900,letterSpacing:1,
            background:`linear-gradient(135deg,${C.neon2},${C.neon1})`,
            WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
            Step {step+1}: {STEPS[step].label} <span style={{fontSize:12,opacity:0.7}}>— {STEPS[step].sub}</span>
          </div>
          <div style={{fontSize:11,color:C.muted,marginTop:2,letterSpacing:0.5}}>{STEPS[step].desc}</div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {STEPS.map((_,i)=>(
            <div key={i} onClick={()=>setStep(i)} style={{
              width:i===step?26:7,height:7,borderRadius:4,cursor:"pointer",
              background:i<=step?`linear-gradient(90deg,${C.neon1},${C.neon4})`:C.border,
              transition:"all 0.3s",
            }} />
          ))}
        </div>
      </div>

      <main style={{padding:"26px 24px 60px",position:"relative",zIndex:1}}>
        <div style={{animation:"fadeUp 0.3s ease"}}>
          {step===0&&<ScriptPanel onReady={setScript} />}
          {step===1&&<MusicPanel apiKeys={keys} script={script} />}
          {step===2&&<VoicePanel apiKeys={keys} script={script} />}
          {step===3&&<VideoPanel apiKeys={keys} script={script} />}
        </div>

        <div style={{display:"flex",justifyContent:"space-between",marginTop:28,paddingTop:20,borderTop:`1px solid ${C.border}`}}>
          <BtnGhost onClick={()=>setStep(p=>Math.max(0,p-1))} disabled={step===0}>← Back</BtnGhost>
          {step<3
            ? <BtnPrimary onClick={()=>setStep(p=>p+1)}>Next: {STEPS[step+1].label} →</BtnPrimary>
            : <BtnPrimary onClick={()=>setStep(0)}>⚡ New Project</BtnPrimary>
          }
        </div>
      </main>
    </div>

    {showSettings&&<Settings keys={keys} setKeys={setKeys} onClose={()=>setShowSettings(false)} />}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
