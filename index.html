/* ─── CLAUDE STREAMING ──────────────────────────────────────── */
const streamClaude = async (prompt, apiKey, onChunk, signal) => {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1500,
      stream: true,
      messages: [{ role: "user", content: prompt }],
    }),
    signal,
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error?.message || `Claude error ${res.status}`); }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let accumulated = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const lines = decoder.decode(value, { stream: true }).split("\n");
    for (const line of lines) {
      if (!line.startsWith("data: ")) continue;
      const raw = line.slice(6).trim();
      if (raw === "[DONE]") continue;
      try {
        const d = JSON.parse(raw);
        if (d.type === "content_block_delta" && d.delta?.text) {
          accumulated += d.delta.text;
          onChunk(accumulated);
        }
      } catch {}
    }
  }
  return accumulated;
};

/* ─── SCENE PARSER ───────────────────────────────────────────── */
const parseScenes = (text) => {
  const section = text.match(/##.*?scene prompt[s]?([\s\S]*?)(?:##|$)/i)?.[1] || "";
  const numbered = section.match(/\d+[.)]\s+.+/g);
  if (numbered && numbered.length > 0)
    return numbered.slice(0, 4).map(s => s.replace(/^\d+[.)]\s+/, "").trim());
  const lines = section.split("\n").map(s => s.trim()).filter(s => s.length > 30);
  return lines.length > 0 ? lines.slice(0, 4) : [text.substring(0, 400)];
};

/* ─── AUTO MODE ──────────────────────────────────────────────── */
function AutoModePanel({ apiKeys, initialBrief, onHistoryEntry }) {
  const [brief,setBrief]=useState(initialBrief||""); const [genre,setGenre]=useState("Afrobeats");
  const [mood,setMood]=useState("Energetic"); const [lang,setLang]=useState("English");
  const [dur,setDur]=useState("3-5 min"); const [voiceId,setVoiceId]=useState("21m00Tcm4TlvDq8ikWAM");
  const [videoEngine,setVideoEngine]=useState("runway"); const [running,setRunning]=useState(false);
  const [stages,setStages]=useState({script:"idle",music:"idle",voice:"idle",video:"idle"});
  const [logs,setLogs]=useState([]); const [results,setResults]=useState({});
  const [showTpl,setShowTpl]=useState(false);
  const logsRef=useRef(null); const abortRef=useRef(null);
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const log=(msg,color=C.muted)=>setLogs(p=>[...p,{msg,color,ts:new Date().toLocaleTimeString()}]);
  const setStage=(k,v)=>setStages(p=>({...p,[k]:v}));

  useEffect(()=>{ if(initialBrief)setBrief(initialBrief); },[initialBrief]);
  useEffect(()=>{ if(logsRef.current)logsRef.current.scrollTop=logsRef.current.scrollHeight; },[logs]);

  const runPipeline=async()=>{
    if(!brief.trim())return;
    abortRef.current=new AbortController();
    setRunning(true);setLogs([]);setResults({});
    setStages({script:"idle",music:"idle",voice:"idle",video:"idle"});
    log("⚡ Pipeline started...",C.neon1);

    // SCRIPT
    if(!apiKeys.claude){setStage("script","error");log("❌ Add Claude API key in Settings.",C.error);setRunning(false);return;}
    log("✍  Streaming script...",C.neon2); setStage("script","loading");
    let scriptText="";
    try {
      const prompt=`You are Videx AI — a bold, professional creative studio.\n\nCreate a full production package for a ${dur} ${genre} ${mood} ${lang} production about: "${brief}"\n\nUse exactly these headers:\n## 🎬 VIDEO SCRIPT\n## 🎵 SONG LYRICS\n## 📽 SCENE PROMPTS\n\nFor SCENE PROMPTS, write 4 numbered cinematic scene descriptions, each on its own line starting with 1. 2. 3. 4.\n\nMake it vivid, commercially powerful, and production-ready.`;
      scriptText=await streamClaude(prompt,apiKeys.claude,t=>setResults(p=>({...p,script:t})),abortRef.current.signal);
      setResults(p=>({...p,script:scriptText})); setStage("script","done"); log("✅ Script ready.",C.success);
    } catch(e){setStage("script","error");log(`❌ Script: ${e.message}`,C.error);setRunning(false);return;}

    // MUSIC
    if(!apiKeys.suno){setStage("music","skipped");log("⏭  Music skipped — no Suno key.",C.muted);}
    else {
      log("🎵 Composing with Suno...",C.neon3); setStage("music","loading");
      try {
        const res=await fetch("https://api.sunoaiapi.com/api/v1/gateway/generate/music",{method:"POST",headers:{"Content-Type":"application/json","api-key":apiKeys.suno},body:JSON.stringify({gpt_description_prompt:scriptText.substring(0,300)+` Style: ${genre}, ${mood}`,make_instrumental:false,mv:"chirp-v3-5"})});
        const data=await res.json(); const songId=data?.data?.[0]?.song_id;
        if(songId){
          log("⏳ Waiting for Suno...",C.neon3); let done=false;
          for(let i=0;i<30;i++){await sleep(5000);const pr=await fetch(`https://api.sunoaiapi.com/api/v1/gateway/feed/${songId}`,{headers:{"api-key":apiKeys.suno}});const pd=await pr.json();const s=pd?.data?.[0];if(s?.status==="complete"&&s?.audio_url){setResults(p=>({...p,music:s}));setStage("music","done");log("✅ Music ready.",C.success);done=true;break;}if(s?.status==="error")break;}
          if(!done){setStage("music","error");log("❌ Music timed out.",C.error);}
        } else{setStage("music","error");log("❌ Suno failed.",C.error);}
      } catch{setStage("music","error");log("❌ Music error.",C.error);}
    }

    // VOICE
    if(!apiKeys.elevenlabs){setStage("voice","skipped");log("⏭  Voice skipped — no ElevenLabs key.",C.muted);}
    else {
      log("🎙 Synthesizing voice...",C.neon4); setStage("voice","loading");
      try {
        const res=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`,{method:"POST",headers:{"Content-Type":"application/json","xi-api-key":apiKeys.elevenlabs},body:JSON.stringify({text:scriptText.substring(0,2500),model_id:"eleven_multilingual_v2",voice_settings:{stability:0.5,similarity_boost:0.75}})});
        if(res.ok){const blob=await res.blob();setResults(p=>({...p,voice:URL.createObjectURL(blob)}));setStage("voice","done");log("✅ Voice ready.",C.success);}
        else{setStage("voice","error");log("❌ ElevenLabs failed.",C.error);}
      } catch{setStage("voice","error");log("❌ Voice error.",C.error);}
    }

    // VIDEO — multi-scene
    const hasVideoKey=videoEngine==="runway"?!!apiKeys.runway:!!apiKeys.luma;
    if(!hasVideoKey){setStage("video","skipped");log("⏭  Video skipped — no key.",C.muted);}
    else {
      const scenes=parseScenes(scriptText);
      log(`🎬 Rendering ${scenes.length} scene${scenes.length>1?"s":""}...`,C.neon2); setStage("video","loading");
      const videoResults=[];
      for(let si=0;si<Math.min(scenes.length,4);si++){
        log(`🎬 Scene ${si+1}/${Math.min(scenes.length,4)}...`,C.neon2);
        try {
          let url="";
          if(videoEngine==="runway"){
            const res=await fetch("https://api.dev.runwayml.com/v1/image_to_video",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKeys.runway}`,"X-Runway-Version":"2024-11-06"},body:JSON.stringify({promptText:scenes[si],model:"gen4_turbo",ratio:"1280:720",duration:5})});
            const d=await res.json();
            if(d?.id){for(let i=0;i<40;i++){await sleep(5000);const pr=await fetch(`https://api.dev.runwayml.com/v1/tasks/${d.id}`,{headers:{"Authorization":`Bearer ${apiKeys.runway}`,"X-Runway-Version":"2024-11-06"}});const pd=await pr.json();if(pd?.status==="SUCCEEDED"&&pd?.output?.[0]){url=pd.output[0];break;}if(pd?.status==="FAILED")break;}}
          } else {
            const res=await fetch("https://api.lumalabs.ai/dream-machine/v1/generations",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKeys.luma}`},body:JSON.stringify({prompt:scenes[si],aspect_ratio:"16:9",loop:false})});
            const d=await res.json();
            if(d?.id){for(let i=0;i<40;i++){await sleep(5000);const pr=await fetch(`https://api.lumalabs.ai/dream-machine/v1/generations/${d.id}`,{headers:{"Authorization":`Bearer ${apiKeys.luma}`}});const pd=await pr.json();if(pd?.state==="completed"&&pd?.assets?.video){url=pd.assets.video;break;}if(pd?.state==="failed")break;}}
          }
          if(url){videoResults.push({url,prompt:scenes[si]});log(`✅ Scene ${si+1} ready.`,C.success);}
          else log(`⚠️ Scene ${si+1} failed.`,C.error);
        } catch{log(`⚠️ Scene ${si+1} error.`,C.error);}
      }
      if(videoResults.length>0){setResults(p=>({...p,videos:videoResults}));setStage("video","done");}
      else setStage("video","error");
    }

    log("🏁 Pipeline complete!",C.neon1);
    setRunning(false);
    // save to history
    setResults(p=>{
      onHistoryEntry({brief,genre,mood,lang,dur,script:scriptText,musicUrl:p.music?.audio_url||"",videoUrl:p.videos?.[0]?.url||""});
      return p;
    });
  };

/* ─── VIDEO PANEL ────────────────────────────────────────────── */
function VideoPanel({ apiKeys, script }) {
  const [engine,setEngine]=useState("runway"); const [prompt,setPrompt]=useState("");
  const [duration,setDuration]=useState(5); const [ratio,setRatio]=useState("1280:720");
  const [status,setStatus]=useState("idle"); const [videos,setVideos]=useState([]);
  const [err,setErr]=useState(""); const [elapsed,setElapsed]=useState(0); const [multiScene,setMultiScene]=useState(false);
  const timer=useRef(null); const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  useEffect(()=>{ if(script){const m=script.match(/scene prompt[s]?[:\s\n]+([\s\S]{0,500})/i);setPrompt(m?m[1].trim():script.substring(0,400));}  },[script]);
  useEffect(()=>{ if(status==="loading"){setElapsed(0);timer.current=setInterval(()=>setElapsed(p=>p+1),1000);}else clearInterval(timer.current);return()=>clearInterval(timer.current); },[status]);
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

  const applyPreset=(p)=>{ setRatio(p.ratio); setDuration(p.dur); };

  const pollRunway=async(id)=>{ for(let i=0;i<40;i++){await sleep(5000);try{const res=await fetch(`https://api.dev.runwayml.com/v1/tasks/${id}`,{headers:{"Authorization":`Bearer ${apiKeys.runway}`,"X-Runway-Version":"2024-11-06"}});const d=await res.json();if(d?.status==="SUCCEEDED"&&d?.output?.[0])return d.output[0];if(d?.status==="FAILED")return null;}catch{}}return null; };
  const pollLuma=async(id)=>{ for(let i=0;i<40;i++){await sleep(5000);try{const res=await fetch(`https://api.lumalabs.ai/dream-machine/v1/generations/${id}`,{headers:{"Authorization":`Bearer ${apiKeys.luma}`}});const d=await res.json();if(d?.state==="completed"&&d?.assets?.video)return d.assets.video;if(d?.state==="failed")return null;}catch{}}return null; };

  const renderScene=async(scenePrompt)=>{
    if(engine==="runway"){
      const res=await fetch("https://api.dev.runwayml.com/v1/image_to_video",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKeys.runway}`,"X-Runway-Version":"2024-11-06"},body:JSON.stringify({promptText:scenePrompt,model:"gen4_turbo",ratio,duration})});
      const d=await res.json(); if(d?.id)return pollRunway(d.id); throw new Error(d?.message||"Runway failed");
    } else {
      const res=await fetch("https://api.lumalabs.ai/dream-machine/v1/generations",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKeys.luma}`},body:JSON.stringify({prompt:scenePrompt,aspect_ratio:"16:9",loop:false})});
      const d=await res.json(); if(d?.id)return pollLuma(d.id); throw new Error(d?.detail||"Luma failed");
    }
  };

  const go=async()=>{
    const key=engine==="runway"?apiKeys.runway:apiKeys.luma;
    if(!key){setErr(`Add your ${engine==="runway"?"Runway ML":"Luma AI"} key in ⚙ Settings.`);return;}
    setStatus("loading");setErr("");setVideos([]);
    try{
      const scenes=multiScene&&script?parseScenes(script):[prompt];
      const results=[];
      for(let i=0;i<Math.min(scenes.length,4);i++){
        const url=await renderScene(scenes[i]);
        if(url)results.push({url,prompt:scenes[i]});
      }
      if(results.length>0){setVideos(results);setStatus("done");}
      else{setErr("All scenes failed.");setStatus("error");}
    }catch(e){setErr(e.message);setStatus("error");}
  };

  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
    <div>
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        <BtnGhost onClick={()=>setEngine("runway")} active={engine==="runway"} color={C.neon2}>🎬 Runway ML</BtnGhost>
        <BtnGhost onClick={()=>setEngine("luma")} active={engine==="luma"} color={C.neon3}>✨ Luma AI</BtnGhost>
      </div>

      {/* Social presets */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:10,fontWeight:800,letterSpacing:2,color:C.neon2,marginBottom:8,textTransform:"uppercase",fontFamily:"'Syne',sans-serif"}}>SOCIAL PRESETS</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {SOCIAL_PRESETS.map(p=>(
            <button key={p.label} onClick={()=>applyPreset(p)}
              style={{background:`${C.neon1}0a`,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 12px",cursor:"pointer",fontFamily:"'Syne',sans-serif",color:C.text,fontSize:11,fontWeight:700,transition:"all 0.15s"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=C.neon1+"80";e.currentTarget.style.background=`${C.neon1}18`;}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.background=`${C.neon1}0a`;}}>
              {p.icon} {p.label} <span style={{color:C.muted,fontWeight:400}}>{p.desc}</span>
            </button>
          ))}
        </div>
      </div>

      <Field label="Scene Description"><FocusTxta rows={4} value={prompt} onChange={e=>setPrompt(e.target.value)} placeholder="Cinematic scene: setting, lighting, mood, camera movement..." /></Field>

      {engine==="runway"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
        <Field label="Duration"><Sel value={duration} onChange={e=>setDuration(Number(e.target.value))}><option value={5}>5 seconds</option><option value={10}>10 seconds</option></Sel></Field>
        <Field label="Aspect Ratio"><Sel value={ratio} onChange={e=>setRatio(e.target.value)}><option value="1280:720">16:9</option><option value="720:1280">9:16</option><option value="1024:1024">1:1</option></Sel></Field>
      </div>}

      {script&&<label style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,cursor:"pointer",fontSize:12,color:multiScene?C.neon2:C.muted,fontFamily:"'Syne',sans-serif",fontWeight:700}}>
        <input type="checkbox" checked={multiScene} onChange={e=>setMultiScene(e.target.checked)} style={{accentColor:C.neon1,width:14,height:14}} />
        Multi-scene (4 scenes from script)
      </label>}

      <div style={{background:`${C.neon2}0a`,border:`1px solid ${C.neon2}25`,borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:12,color:C.muted,fontFamily:"'Syne',sans-serif",lineHeight:1.6}}>
        ⏱ Each scene takes <strong style={{color:C.neon2}}>1–3 minutes</strong>. Keep this tab open.
      </div>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <BtnPrimary onClick={go} disabled={status==="loading"} color={C.neon2}>{status==="loading"&&<Spinner color={C.neon2} />}{status==="loading"?`Rendering… ${fmt(elapsed)}`:"🎬 Generate Video"}</BtnPrimary>
        <StatusPill status={status} />
      </div>
      {err&&<div style={{color:C.error,fontSize:12,marginTop:10,fontFamily:"'Syne',sans-serif"}}>{err}</div>}
    </div>

    <div>
      {videos.length>0 ? <Card title={`Scenes (${videos.length})`} color={C.neon2}>
        <div style={{display:"grid",gridTemplateColumns:videos.length>1?"1fr 1fr":"1fr",gap:10}}>
          {videos.map((v,i)=>(
            <div key={i}>
              <video controls src={v.url} style={{width:"100%",borderRadius:8,marginBottom:6}} />
              <a href={v.url} download={`scene-${i+1}.mp4`} style={{textDecoration:"none"}}><BtnGhost color={C.neon2} style={{fontSize:10,padding:"5px 10px"}}>⬇ Scene {i+1}</BtnGhost></a>
            </div>
          ))}
        </div>
      </Card> : <EmptyState icon="🎬" title="Video renders here" sub="Cinematic quality with Runway or Luma" />}
    </div>
  </div>;
}

/* ─── IMAGE PANEL ────────────────────────────────────────────── */
function ImagePanel({ apiKeys }) {
  const [prompt,setPrompt]=useState(""); const [style,setStyle]=useState("Cinematic");
  const [ratio,setRatio]=useState("16:9"); const [count,setCount]=useState(4);
  const [status,setStatus]=useState("idle"); const [images,setImages]=useState([]); const [err,setErr]=useState("");
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  const go=async()=>{
    if(!prompt.trim())return;
    if(!apiKeys.replicate){setErr("Add your Replicate API key in ⚙ Settings.");return;}
    setStatus("loading");setErr("");setImages([]);
    try {
      const res=await fetch("https://api.replicate.com/v1/models/black-forest-labs/flux-schnell/predictions",{
        method:"POST",
        headers:{"Authorization":`Token ${apiKeys.replicate}`,"Content-Type":"application/json"},
        body:JSON.stringify({input:{prompt:`${prompt}, ${style} style, high quality, detailed`,aspect_ratio:ratio,num_outputs:count,output_format:"webp",output_quality:90}})
      });
      const d=await res.json();
      if(!d.id){setErr(d.detail||"Replicate failed.");setStatus("error");return;}
      for(let i=0;i<30;i++){
        await sleep(2000);
        const pr=await fetch(`https://api.replicate.com/v1/predictions/${d.id}`,{headers:{"Authorization":`Token ${apiKeys.replicate}`}});
        const pd=await pr.json();
        if(pd.status==="succeeded"&&pd.output){setImages(Array.isArray(pd.output)?pd.output:[pd.output]);setStatus("done");return;}
        if(pd.status==="failed"){setErr(pd.error||"Generation failed.");setStatus("error");return;}
      }
      setErr("Timed out.");setStatus("error");
    } catch(e){setErr(e.message);setStatus("error");}
  };

  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
    <div>
      <div style={{marginBottom:16,padding:"12px 16px",background:`${C.neon5}0a`,border:`1px solid ${C.neon5}30`,borderRadius:10}}>
        <span style={{fontSize:10,fontWeight:800,color:C.neon5,letterSpacing:2,fontFamily:"'Syne',sans-serif"}}>FLUX SCHNELL · REPLICATE</span>
        <p style={{fontSize:12,color:C.muted,marginTop:6,fontFamily:"'Syne',sans-serif",lineHeight:1.6}}>Generate album art, thumbnails, and scene stills in seconds.</p>
      </div>
      <Field label="Image Prompt"><FocusTxta rows={5} value={prompt} onChange={e=>setPrompt(e.target.value)} placeholder="e.g. Afrobeats artist on Lagos rooftop at golden hour, crowd below, city lights..." /></Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
        <Field label="Style"><Sel value={style} onChange={e=>setStyle(e.target.value)}>{IMG_STYLES.map(s=><option key={s}>{s}</option>)}</Sel></Field>
        <Field label="Ratio"><Sel value={ratio} onChange={e=>setRatio(e.target.value)}>{IMG_RATIOS.map(r=><option key={r.val} value={r.val}>{r.label}</option>)}</Sel></Field>
        <Field label="Count"><Sel value={count} onChange={e=>setCount(Number(e.target.value))}>{[1,2,4].map(n=><option key={n} value={n}>{n} image{n>1?"s":""}</option>)}</Sel></Field>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <BtnPrimary onClick={go} disabled={status==="loading"||!prompt.trim()} color={C.neon5}>{status==="loading"&&<Spinner color={C.neon5} />}{status==="loading"?"Generating...":"🖼 Generate Images"}</BtnPrimary>
        <StatusPill status={status} />
      </div>
      {err&&<div style={{color:C.error,fontSize:12,marginTop:10,fontFamily:"'Syne',sans-serif"}}>{err}</div>}
    </div>

    <div>
      {images.length>0 ? <Card title={`Images (${images.length})`} color={C.neon5}>
        <div style={{display:"grid",gridTemplateColumns:images.length>1?"1fr 1fr":"1fr",gap:10}}>
          {images.map((url,i)=>(
            <div key={i}>
              <img src={url} alt={`Generated ${i+1}`} style={{width:"100%",borderRadius:8,marginBottom:6,display:"block"}} />
              <a href={url} download={`videx-image-${i+1}.webp`} target="_blank" rel="noreferrer" style={{textDecoration:"none"}}>
                <BtnGhost color={C.neon5} style={{fontSize:10,padding:"5px 10px"}}>⬇ Download</BtnGhost>
              </a>
            </div>
          ))}
        </div>
      </Card> : <EmptyState icon="🖼" title="Images appear here" sub="Fast generation with Flux Schnell" />}
    </div>
  </div>;
}

/* ─── HISTORY PANEL ──────────────────────────────────────────── */
function HistoryPanel({ onLoad }) {
  const [history,setHistory]=useState([]);
  const [expanded,setExpanded]=useState(null);

  useEffect(()=>{ setHistory(loadHistory()); },[]);

  const clear=()=>{ localStorage.removeItem("videx_history"); setHistory([]); };

  if(history.length===0) return <EmptyState icon="📁" title="No history yet" sub="Run the pipeline to automatically save your projects" />;

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
      <div style={{fontSize:13,color:C.muted,fontFamily:"'Syne',sans-serif"}}>{history.length} saved project{history.length!==1?"s":""}</div>
      <BtnGhost onClick={clear} color={C.error} style={{fontSize:10,padding:"5px 12px"}}>Clear All</BtnGhost>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {history.map(item=>(
        <div key={item.id} style={{background:C.card,border:`1px solid ${expanded===item.id?C.neon1+"60":C.border}`,borderRadius:14,overflow:"hidden",transition:"all 0.2s"}}>
          <div onClick={()=>setExpanded(expanded===item.id?null:item.id)}
            style={{padding:"16px 20px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:C.text,fontFamily:"'Syne',sans-serif",marginBottom:4}}>{item.brief?.substring(0,80)}…</div>
              <div style={{display:"flex",gap:12,fontSize:11,color:C.muted,fontFamily:"'Syne',sans-serif"}}>
                <span>{new Date(item.ts).toLocaleString()}</span>
                <span>·</span><span style={{color:C.neon2}}>{item.genre}</span>
                <span>·</span><span>{item.mood}</span>
                <span>·</span><span>{item.lang}</span>
              </div>
            </div>
            <div style={{display:"flex",gap:8,marginLeft:16}}>
              <BtnGhost onClick={e=>{e.stopPropagation();onLoad(item);}} color={C.neon1} style={{fontSize:10,padding:"5px 10px"}}>Load</BtnGhost>
              <span style={{color:C.muted,fontSize:14}}>{expanded===item.id?"▲":"▼"}</span>
            </div>
          </div>
          {expanded===item.id&&<div style={{padding:"0 20px 20px",borderTop:`1px solid ${C.border}`}}>
            {item.script&&<div style={{marginTop:16}}>
              <div style={{fontSize:10,fontWeight:800,color:C.neon1,letterSpacing:2,marginBottom:8,fontFamily:"'Syne',sans-serif"}}>SCRIPT</div>
              <pre style={{color:C.text,fontSize:11,lineHeight:1.7,whiteSpace:"pre-wrap",fontFamily:"'Syne',sans-serif",maxHeight:200,overflowY:"auto",background:C.bg,padding:12,borderRadius:8}}>{item.script}</pre>
            </div>}
            {item.musicUrl&&<div style={{marginTop:14}}>
              <div style={{fontSize:10,fontWeight:800,color:C.neon3,letterSpacing:2,marginBottom:8,fontFamily:"'Syne',sans-serif"}}>MUSIC</div>
              <audio controls src={item.musicUrl} style={{width:"100%",borderRadius:8}} />
            </div>}
            {item.videoUrl&&<div style={{marginTop:14}}>
              <div style={{fontSize:10,fontWeight:800,color:C.neon2,letterSpacing:2,marginBottom:8,fontFamily:"'Syne',sans-serif"}}>VIDEO</div>
              <video controls src={item.videoUrl} style={{width:"100%",borderRadius:8,maxHeight:200}} />
            </div>}
          </div>}
        </div>
      ))}
    </div>
  </div>;
}

/* ─── SETTINGS ───────────────────────────────────────────────── */
function Settings({ keys, setKeys, onClose }) {
  const [local,setLocal]=useState({...keys}); const [show,setShow]=useState({});
  const fields=[
    {k:"claude",   label:"Claude (Anthropic)", color:C.neon1, hint:"Required for script generation"},
    {k:"suno",     label:"Suno AI",             color:C.neon3, hint:"Music generation"},
    {k:"elevenlabs",label:"ElevenLabs",         color:C.neon4, hint:"Voice synthesis"},
    {k:"runway",   label:"Runway ML",           color:C.neon2, hint:"Video generation"},
    {k:"luma",     label:"Luma AI",             color:C.neon2, hint:"Video generation (alternative)"},
    {k:"replicate",label:"Replicate",           color:C.neon5, hint:"Image generation (Flux)"},
  ];
  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2000,backdropFilter:"blur(12px)"}}>
    <div style={{background:C.surface,border:`1px solid ${C.neon1}40`,borderRadius:20,padding:32,width:"min(500px,94vw)",maxHeight:"90vh",overflowY:"auto",boxShadow:`0 0 80px ${C.neon1}18`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
        <div>
          <span style={{fontSize:18,fontWeight:900,fontFamily:"'Syne',sans-serif",background:`linear-gradient(135deg,${C.neon1},${C.neon2})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>API Keys</span>
          <div style={{fontSize:11,color:C.muted,fontFamily:"'Syne',sans-serif",marginTop:3}}>Saved to your browser — never shared</div>
        </div>
        <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:22}}>✕</button>
      </div>
      {fields.map(({k,label:l,color,hint})=>(
        <div key={k} style={{marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
            <label style={{...lbl,color,margin:0}}>{l}</label>
            <span style={{fontSize:10,color:C.muted,fontFamily:"'Syne',sans-serif"}}>{hint}</span>
          </div>
          <div style={{position:"relative"}}>
            <input type={show[k]?"text":"password"} value={local[k]||""} onChange={e=>setLocal(p=>({...p,[k]:e.target.value}))} placeholder={`Your ${l} API key`} style={{...inp,paddingRight:52}} />
            <button onClick={()=>setShow(p=>({...p,[k]:!p[k]}))} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color,cursor:"pointer",fontSize:10,fontWeight:800,letterSpacing:1,fontFamily:"'Syne',sans-serif"}}>{show[k]?"HIDE":"SHOW"}</button>
          </div>
        </div>
      ))}
      <BtnPrimary onClick={()=>{setKeys(local);saveKeys(local);onClose();}} style={{width:"100%",marginTop:10}}>Save Keys</BtnPrimary>
      <p style={{fontSize:10,color:C.muted,marginTop:12,fontFamily:"'Syne',sans-serif",lineHeight:1.7,textAlign:"center"}}>Keys are saved to localStorage. Never logged or shared.</p>
    </div>
  </div>;
}

/* ─── APP ────────────────────────────────────────────────────── */
const ALL_TABS=[
  {id:"auto",    icon:"⚡", label:"Auto Mode"},
  {id:"script",  icon:"✍", label:"Script"},
  {id:"music",   icon:"🎵", label:"Music"},
  {id:"voice",   icon:"🎙", label:"Voice"},
  {id:"video",   icon:"🎬", label:"Video"},
  {id:"image",   icon:"🖼", label:"Image"},
  {id:"history", icon:"📁", label:"History"},
];

function App() {
  const [tab,setTab]=useState("auto");
  const [keys,setKeys]=useState(loadKeys);
  const [showSettings,setShowSettings]=useState(false);
  const [script,setScript]=useState("");
  const [loadedBrief,setLoadedBrief]=useState("");
  const keysSet=Object.values(keys).some(v=>v&&v.length>0);

  const handleSetKeys=(k)=>{ setKeys(k); saveKeys(k); };

  const handleHistoryLoad=(item)=>{
    setLoadedBrief(item.brief||"");
    setScript(item.script||"");
    setTab("auto");
  };

  return <>
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&display=swap');
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      body{background:${C.bg};font-family:'Syne',sans-serif}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}
      @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:${C.neon1}50;border-radius:2px}
      select option{background:${C.surface};color:${C.text}}
      input[type=range]{height:4px;border-radius:2px}
    `}</style>

    <div style={{minHeight:"100vh",background:C.bg,color:C.text,position:"relative",overflow:"hidden"}}>
      <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0}}>
        <Glow color={C.neon1} size={700} x="5%"  y="15%" opacity={0.06} />
        <Glow color={C.neon4} size={500} x="95%" y="55%" opacity={0.05} />
        <Glow color={C.neon2} size={400} x="55%" y="95%" opacity={0.04} />
      </div>

      <header style={{position:"sticky",top:0,zIndex:100,background:"rgba(5,5,15,0.92)",backdropFilter:"blur(20px)",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",height:56,gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
          <div style={{width:30,height:30,borderRadius:8,background:`linear-gradient(135deg,${C.neon1},${C.neon4})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,boxShadow:`0 0 16px ${C.neon1}50`}}>⚡</div>
          <div>
            <div style={{fontSize:15,fontWeight:900,letterSpacing:3,background:`linear-gradient(135deg,${C.neon2},${C.neon1},${C.neon4})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>VIDEX</div>
            <div style={{fontSize:7,color:C.muted,letterSpacing:2,marginTop:-2}}>AI CREATOR STUDIO</div>
          </div>
        </div>

        <div style={{display:"flex",alignItems:"center",gap:2,overflowX:"auto"}}>
          {ALL_TABS.map((t,i)=>{
            const active=tab===t.id;
            const isAuto=t.id==="auto";
            return <div key={t.id} style={{display:"flex",alignItems:"center"}}>
              <button onClick={()=>setTab(t.id)} style={{
                background:active?`linear-gradient(135deg,${C.neon1},${C.neon4})`:"transparent",
                border:active?"none":`1px solid ${isAuto&&!active?C.neon1+"50":C.border}`,
                borderRadius:7,padding:"4px 11px",cursor:"pointer",whiteSpace:"nowrap",
                color:active?"#fff":isAuto?C.neon1:C.muted,fontSize:11,fontWeight:800,letterSpacing:0.5,
                fontFamily:"'Syne',sans-serif",boxShadow:active?`0 0 14px ${C.neon1}50`:"none",transition:"all 0.2s"
              }}>{t.icon} {t.label}</button>
              {i<ALL_TABS.length-1&&i>0&&<div style={{width:1,height:14,background:C.border,margin:"0 1px"}} />}
            </div>;
          })}
        </div>

        <button onClick={()=>setShowSettings(true)} style={{
          background:keysSet?`${C.neon1}15`:"transparent",border:`1px solid ${keysSet?C.neon1:C.border}`,
          borderRadius:8,padding:"5px 13px",cursor:"pointer",flexShrink:0,
          color:keysSet?C.neon1:C.muted,fontSize:11,fontWeight:800,letterSpacing:1,
          fontFamily:"'Syne',sans-serif",boxShadow:keysSet?`0 0 10px ${C.neon1}30`:"none",transition:"all 0.2s"
        }}>⚙ {keysSet?"Keys ✓":"API Keys"}</button>
      </header>

      <main style={{padding:"24px 20px 60px",position:"relative",zIndex:1}}>
        <div style={{animation:"fadeUp 0.3s ease"}}>
          {tab==="auto"    && <AutoModePanel apiKeys={keys} initialBrief={loadedBrief} onHistoryEntry={pushHistory} />}
          {tab==="script"  && <ScriptPanel onReady={setScript} apiKeys={keys} />}
          {tab==="music"   && <MusicPanel apiKeys={keys} script={script} />}
          {tab==="voice"   && <VoicePanel apiKeys={keys} script={script} />}
          {tab==="video"   && <VideoPanel apiKeys={keys} script={script} />}
          {tab==="image"   && <ImagePanel apiKeys={keys} />}
          {tab==="history" && <HistoryPanel onLoad={handleHistoryLoad} />}
        </div>
      </main>
    </div>

    {showSettings&&<Settings keys={keys} setKeys={handleSetKeys} onClose={()=>setShowSettings(false)} />}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
